name: Validate & Generate SDKs

on:
  push:
    branches: [ main ]
    paths:
      - 'openapi/**'
      - 'scripts/**'
      - 'facade/**'
      - 'python-client.yaml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-schema:
    name: Validate OpenAPI 3.1 Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate OpenAPI Schema
        uses: char0n/swagger-editor-validate@v1
        with:
          definition-file: openapi/public-v1.yaml

  check-generation:
    name: Test Code Generation Toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Verify tools presence
        run: |
          go version
          node --version
          uv --version

  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [validate-schema, check-generation]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Send deployment notification
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          SCHEMA_STATUS: ${{ needs.validate-schema.result }}
          GEN_STATUS: ${{ needs.check-generation.result }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          ENVIRONMENT: prod
          REF_NAME: ${{ github.ref_name }}
          COMMIT_HASH: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APP_NAME: Upassist SDK Toolchain & OpenAPI Spec
          SITE_URL: https://github.com/upassist-cloud/sdks
        run: |
          if [ "$SCHEMA_STATUS" = "success" ] && [ "$GEN_STATUS" = "success" ]; then
            STATUS="success"
          elif [ "$SCHEMA_STATUS" = "cancelled" ] || [ "$GEN_STATUS" = "cancelled" ]; then
            STATUS="cancelled"
          else
            STATUS="failure"
          fi

          COMMIT_MESSAGE="$(git log -1 --pretty=%s 2>/dev/null || true)"

          payload=$(jq -n \
            --arg status "$STATUS" \
            --arg repository "$REPO" \
            --arg workflow "$WORKFLOW" \
            --arg environment "$ENVIRONMENT" \
            --arg ref_name "$REF_NAME" \
            --arg commit_hash "$COMMIT_HASH" \
            --arg commit_message "$COMMIT_MESSAGE" \
            --arg actor "$ACTOR" \
            --arg run_url "$RUN_URL" \
            --arg app_name "$APP_NAME" \
            --arg url "$SITE_URL" \
            '{status:$status, repository:$repository, workflow:$workflow,
              environment:$environment, ref_name:$ref_name, commit_hash:$commit_hash,
              commit_message:$commit_message, actor:$actor, run_url:$run_url,
              app_name:$app_name, url:$url}')

          curl -sS --max-time 15 -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" "$WEBHOOK_URL"
