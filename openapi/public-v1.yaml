info:
  title: Upassist Public API
  version: 1.0.0
  description: 'Management API for heartbeats, monitors, and incidents. Send Authorization:
    Bearer <project api key>. An empty scope list allows every scope. Unknown response
    fields may appear in later releases; clients must ignore them. Removals and renames
    require a new version. Errors use code, message, and request_id. Send X-Request-Id
    to have it echoed.


    Heartbeat pings go to the heartbeat server. Log batches go to https://logs.upassist.cloud/collect
    and use a source token. Metric batches go to https://metrics.upassist.cloud/collect
    with the same source token. Site events go to https://rum.upassist.cloud/api/sites/events
    with the site client key. Application errors use the official Sentry SDKs.'
openapi: 3.1.0
servers:
- url: https://api.upassist.cloud
  description: Management
- url: https://heartbeats.upassist.cloud
  description: Heartbeat ingest
- url: https://logs.upassist.cloud
  description: Log ingest
- url: https://metrics.upassist.cloud
  description: Metric ingest
- url: https://rum.upassist.cloud
  description: Site events
